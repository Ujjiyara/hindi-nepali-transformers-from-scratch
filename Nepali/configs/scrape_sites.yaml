    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # Has a wp-sitemap index of 134 post sitemaps (~134,000 articles). It was
  # first configured to crawl, which found 718 URLs -- the sitemap was simply
  # not looked for. Probing every configured site for the usual sitemap paths
  # is worth doing before crawling any of them.
  - name: bizmandu
    base_url: "https://bizmandu.com"
    strategies: ["sitemap", "rss", "crawl"]
    sitemap_urls:
      - "https://bizmandu.com/wp-sitemap.xml"
    sitemap_exclude:
