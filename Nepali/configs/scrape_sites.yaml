      - "/wp-content/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 150000
    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  - name: baahrakhari
    base_url: "https://baahrakhari.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/detail/\\d+"
    url_exclude:
      - "/shorts-viewer/"
      - "/author/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 60000
    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  - name: thahakhabar
    base_url: "https://www.thahakhabar.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/detail/\\d+"
    url_exclude:
      - "/author/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 60000
    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  - name: sajhapost
    base_url: "https://www.sajhapost.com"
