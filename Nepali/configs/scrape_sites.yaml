# Nepali (Model L) scrape configuration.
#
# Every site here was checked with `triage` before being crawled: it must be
# reachable, permitted by robots.txt, and serve server-rendered Devanagari to a
# plain HTTP client. Sites that render via JavaScript return an almost empty
# shell, and sites using legacy Preeti/Kantipur fonts return ASCII that only
# *looks* like Devanagari in a browser; both are useless and both are far
# cheaper to detect now than after an overnight scrape. Rejected on those
# grounds: himalkhabar and nepalpress (JavaScript-rendered), lokaantar,
# nepalkhabar and annapurnapost (robots.txt disallow).
#
# Of the sites that passed, only khabarhub publishes a real article sitemap.
# setopati has a sitemap tree, but it lists category/tag/author pages only, so
# there `crawl` does the real work and `sitemap`/`rss` supply seed URLs.
#
# Usage:
#   python -m common.scrape.run triage   --config Nepali/configs/scrape_sites.yaml
#   python -m common.scrape.run discover --config Nepali/configs/scrape_sites.yaml --site onlinekhabar
#   python -m common.scrape.run fetch    --config Nepali/configs/scrape_sites.yaml --site onlinekhabar --limit 5
#   python -m common.scrape.run extract  --config Nepali/configs/scrape_sites.yaml --site onlinekhabar
#
# NOTE: setopati stopped accepting connections after an early run fetched its
# sitemap tree too fast. The politeness delay now applies to every request, but
# give that host time before retrying it.

lang: ne
data_root: Nepali/data
user_agent: "IIIT-LMA-corpus-research/1.0 (sakshamgoyal.sgm27@gmail.com)"

request_timeout: [5.0, 30.0]
max_retries: 3
min_chars: 200

sites:
  # Article URLs look like /2026/08/1998011/some-slug
  - name: onlinekhabar
    base_url: "https://www.onlinekhabar.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/\\d{4}/\\d{2}/\\d{5,}"
    url_exclude:
      - "/tag/"
      - "/author/"
      - "/category/"
      - "/page/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 80000
    delay_seconds: 1.5
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # Article URLs look like /politics/396098  (category + numeric id)
  - name: setopati
    base_url: "https://www.setopati.com"
    strategies: ["sitemap", "rss", "crawl"]
    url_include:
      - "/\\d{5,}$"
    url_exclude:
      - "/tag/"
      - "/author/"
      - "/pages/"
      - "/sitemap"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 40000
    delay_seconds: 2.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # robots.txt declares Crawl-delay: 20, which the fetcher honours. That caps
  # this source at ~180 pages/hour, so treat it as a small supplementary source
  # rather than a main one.
  - name: ratopati
    base_url: "https://www.ratopati.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/story/\\d+"
      - "/\\d{5,}$"
    url_exclude:
      - "/tag/"
      - "/category/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 3000
    delay_seconds: 20.0
    crawl_max_pages: 200
    crawl_max_depth: 3

  # Article URLs look like /health/some-slug-23-55.html  (slug + two numeric
  # segments + .html), NOT a long numeric id -- verified against its RSS feed.
  - name: nagariknews
    base_url: "https://nagariknews.nagariknetwork.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "-\\d+-\\d+\\.html$"
    url_exclude:
      - "/tag/"
      - "/category/"
      - "/feed"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 60000
    delay_seconds: 2.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  - name: ekantipur
    base_url: "https://ekantipur.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/\\d{4}/\\d{2}/\\d{2}/"
      - "/news/\\d+"
    url_exclude:
      - "/tag/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 60000
    delay_seconds: 2.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # Added 18 Aug 2026. Model L's corpus needed considerably more manually
  # collected text to stay clear of the 20% floor once CC-100 was folded in,
  # and one site fetching at its own polite delay is a throughput ceiling --
  # more *sites* is the only way to raise it, since each gets its own thread.
  # Triaged the same way as the others; himalkhabar, lokaantar, nepalkhabar,
  # nepalpress and annapurnapost were tried and rejected (JavaScript-rendered
  # templates, or robots.txt disallow).
  #
  # This is the one Nepali site with a real article sitemap: a WordPress
  # wp-sitemap index of 131 post sitemaps, ~262,000 articles, discoverable in
  # minutes instead of hours of crawling. Article URLs are /YYYY/WW/ID/.
  # The site also publishes an English edition; those articles are dropped
  # automatically by the extractor's Devanagari-ratio filter.
  - name: khabarhub
    base_url: "https://khabarhub.com"
    strategies: ["sitemap"]
    sitemap_urls:
      - "https://khabarhub.com/wp-sitemap.xml"
    sitemap_exclude:
      - "taxonomies"
      - "users"
      - "wp-sitemap-posts-page"
    url_include:
      - "/\\d{4}/\\d{1,2}/\\d{3,}/?$"
    url_exclude:
      - "/wp-content/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 200000
    delay_seconds: 1.0

  # Article URLs look like /detail/130598.
  - name: ujyaaloonline
    base_url: "https://www.ujyaaloonline.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/detail/\\d+"
    url_exclude:
      - "/author/"
      - "/program/"
      - "/shorts-viewer/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 40000
    delay_seconds: 2.0
    crawl_max_pages: 4000
    crawl_max_depth: 4

  # Article URLs look like /news-details/123456/2026-08-18.
  - name: hamrakura
    base_url: "https://www.hamrakura.com"
    strategies: ["rss", "crawl"]
    url_include:
      - "/news-details/\\d+"
    url_exclude:
      - "/tag/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 40000
    delay_seconds: 2.0
    crawl_max_pages: 4000
    crawl_max_depth: 4

  # Added 20 Aug 2026, after the 20% floor turned out to be the real ceiling on
  # Model L's corpus size rather than the amount of downloadable text. Because
  # the rule ties total size to manual size, every manually collected character
  # permits four downloaded ones -- manual text is worth five times its weight,
  # so more scraping is the only thing that grows this corpus.
  #
  # All ten passed the same triage as the rest. nepalisamaya does not resolve;
  # techpana and lawcommission.gov.np both declare Crawl-delay: 10, which caps
  # them near 6 pages/minute -- worth having eventually, not worth a thread on
  # an overnight run.

  # State-owned daily with a large archive. Article URLs are /news/<id>.
  - name: gorkhapatra
    base_url: "https://gorkhapatraonline.com"
    strategies: ["sitemap", "rss", "crawl"]
    url_include:
      - "/news/\\d+"
    url_exclude:
      - "/pdf/"
      - "/storage/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 60000
    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # WordPress date URLs, /YYYY/MM/<id>/.
  - name: makalukhabar
    base_url: "https://www.makalukhabar.com"
    strategies: ["sitemap", "rss", "crawl"]
    url_include:
      - "/\\d{4}/\\d{2}/\\d+/?$"
    url_exclude:
      - "/category/"
      - "/wp-json/"
      - "/wp-content/"
      - "\\.(jpg|jpeg|png|gif|pdf|mp4|mp3)$"
    max_urls: 150000
    delay_seconds: 1.0
    crawl_max_pages: 6000
    crawl_max_depth: 4

  # WordPress with a fuller date path, /YYYY/MM/DD/<id>/.
  - name: deshsanchar
