# Model L -- Nepali synthetic comparative-reasoning dataset.
#
# Read by common/reasoning/generate.py. Same task families as the Hindi set,
# but written from Nepali grammar rather than translated from the Hindi file:
#
#   * Postpositions attach to the noun with no space: "रामको", "श्यामभन्दा".
#     Templates therefore write "{name}को" and "{b}भन्दा".
#   * Comparison is "A B-भन्दा ADJ छ", with no comparative morpheme on the
#     adjective. Adjectives in -ो take -ी for a feminine subject (अग्लो/अग्ली),
#     and the copula follows the subject too: "छ" for a masculine subject,
#     "छिन्" for a feminine one. Invariant adjectives (गह्रौं, हलुका) list the
#     same word twice.
#   * Objects take the masculine forms and "छ" throughout.
#
# Numbers are written in Devanagari digits, which is what the Nepali corpus --
# and so the Nepali tokenizer -- uses ("▁१५", "२").

lang: ne
digits: devanagari
seed: 20260916

sizes:
  train: 20000
  validation: 1000
  test: 2000
  test_long: 1000

name_split: {train: 0.6, validation: 0.2, test: 0.2}

prompt: "प्रश्न: {body} उत्तर:"
answer_yes: "हो"
answer_no: "होइन"
answer_equal: "दुवै बराबर छन्"

copula: {m: छ, f: छिन्}

people:
  m: [राम, हरि, श्याम, बिकास, प्रकाश, दीपक, सुरेश, रमेश, दिनेश, गणेश,
      महेश, नवीन, सन्तोष, राजन, सुजन, रोशन, बिनोद, प्रदीप, कृष्ण, गोपाल,
      अर्जुन, बसन्त, हेमन्त, सागर, आकाश, मनोज, अनिल, सुनिल, भरत, केशव,
      नरेन्द्र, उमेश, योगेश, किशोर, शिव, रवि, विष्णु, नारायण, पवन, सरोज,
      अमृत, अनुप, बिजय, बिमल, बिशाल, चन्द्र, देवेन्द्र, धर्मेन्द्र, गोविन्द, हिमाल,
      ईश्वर, जगदीश, जीवन, कमल, कपिल, कुमार, लोकेश, माधव, मदन, मिलन,
      निराजन, निशान्त, ओम, पदम, पुष्कर, राजेश, रमण, रुपेश, साजन, समीर,
      सञ्जय, शङ्कर, शेखर, सिद्धार्थ, सुदीप, सुशील, तारक, उद्धव, उत्तम, विवेक,
      युवराज, अच्युत, अभिषेक, आशिष, भीम, भूपेन्द्र, चेतन, दिलीप, गौतम, हरिश,
      इन्द्र, जनक, ज्ञान, कैलाश, लक्ष्मण, मोहन, नबिन, नरेश, प्रभात, प्रमोद,
      प्रविण, राजु, रितेश, सौरभ]
  f: [सीता, गीता, सरिता, कमला, पार्वती, सुनिता, अनिता, बिन्दु, मञ्जु, सविता,
      रिता, शान्ति, लक्ष्मी, सुष्मा, पूजा, अस्मिता, प्रतिभा, रेणु, सपना, निर्मला,
      शर्मिला, उर्मिला, अञ्जना, कल्पना, रचना, मनिषा, बबिता, सुमित्रा, इन्दिरा, राधा,
      दीपा, सृजना, प्रमिला, जमुना, गंगा, सरस्वती, तारा, मीना, नीता, कविता,
      अमिता, अनुसा, अर्चना, आरती, भगवती, भावना, चन्द्रकला, दुर्गा, गौरी, हिरा,
      इशा, जानकी, ज्योति, कौशल्या, कुसुम, ललिता, माया, मीरा, मुना, नन्दा,
      निशा, पद्मा, पवित्रा, पुष्पा, रश्मि, रोजिना, सावित्री, शोभा, सुजाता, सुशिला,
      सुस्मिता, तुलसी, उषा, यमुना, यशोदा, अप्सरा, बिमला, चमेली, देवकी, धनमाया,
      गीतिका, हेमा, जुना, कमली, लीला, मालती, नविना, प्रिया, रञ्जना, रुपा,
      सानु, शकुन्तला, सुनैना, सुवर्णा]

