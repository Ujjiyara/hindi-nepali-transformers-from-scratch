# Model L tokenizer, selected from the vocabulary sweep in report/phase1.md.
#
# 16,000 rather than 32,000: utilisation holds at 97.3% here but falls to 88.8%
# at 32k, so more than a tenth of a 32,000-entry vocabulary would never appear
# in held-out text while still consuming embedding parameters. The price is
# 8.0% higher fertility than 32k, for half the embedding cost.
#
# 16,000 rather than 8,000: fertility is 11.6% better at effectively identical
# utilisation (97.3% against 97.6%).
#
# Model L lands on the same size as Model H. That is a result, not a shared
# setting: the two sweeps were run independently on their own corpora and both
# show utilisation holding to 16k and falling away beyond it. It also makes the
# fertility gap between the two languages a like-for-like comparison rather
# than an artefact of different vocabulary budgets.
lang: ne
model_type: unigram
vocab_size: 16000
character_coverage: 0.9995
byte_fallback: true
model_path: Nepali/tokenizer/ne_unigram_16000.model
vocab_path: Nepali/tokenizer/ne_unigram_16000.vocab
# Measured on the validation split by common/tokenizer/evaluate.py. The report
# reads these numbers from tokenizer/sweep.json rather than from here, so a
# stale value in this file cannot reach the report.
measured:
  fertility: 1.3687
  chars_per_token: 4.6807
  unknown_rate: 0.0
  byte_fallback_rate: 0.0050377
  vocab_utilisation: 0.9726
