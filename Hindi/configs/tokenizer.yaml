# Model H tokenizer, selected from the vocabulary sweep in report/phase1.md.
#
# 16,000 rather than 32,000: vocabulary utilisation peaks here (97.7%, against
# 90.9% at 32k) and the embedding table costs 6.1M instead of 12.3M parameters
# -- roughly a quarter of the ~25M Phase 2 budget rather than half of it. The
# price is 6.0% higher fertility than 32k.
#
# 16,000 rather than 8,000: fertility is 8.7% better for no loss of utilisation
# (97.7% against 97.5%), so the larger vocabulary is paid for by tokens that
# held-out text actually uses.
lang: hi
model_type: unigram
vocab_size: 16000
character_coverage: 0.9995
byte_fallback: true
model_path: Hindi/tokenizer/hi_unigram_16000.model
vocab_path: Hindi/tokenizer/hi_unigram_16000.vocab
# Measured on the validation split by common/tokenizer/evaluate.py. The report
# reads these numbers from tokenizer/sweep.json rather than from here, so a
# stale value in this file cannot reach the report.
measured:
  fertility: 1.2812
  chars_per_token: 3.9617
  unknown_rate: 0.0
  byte_fallback_rate: 0.0039315
  vocab_utilisation: 0.9768
