# Model H -- Hindi reasoning finetune (Phase 3).
#
# Same keys as train.yaml, read by the same loader, so every pretraining
# setting that is not mentioned here means the same thing it did there.
#
# Data: 20,000 training examples of ~33 tokens (reasoning.yaml). One step is
# batch_size * grad_accum = 32 examples, so 1,250 steps is 40,000 examples,
# two epochs. Two passes over templated data is enough for the answer loss to
# flatten; more would mostly memorise the training names, which the held-out
# test names are there to expose.
#
# Peak learning rate 3e-4 is half the pretraining peak. Full-model finetuning
# from a converged checkpoint needs a smaller step than training from scratch
# -- the weights already sit in a good basin -- but the task (emit one name or
# yes/no after a fixed frame) is far from anything in the corpus, so the rate
# must still be large enough to move the model within two epochs. The warmup
# is 60 steps (~5%): the AdamW moments start from zero, since pretraining's
# moments describe a different loss surface and are deliberately not loaded.
#
# Dropout stays at the pretraining value, 0.1, read from the checkpoint.
#
# eval_batches 16 x batch_size 32 = 512 validation examples per check.
# checkpoint_interval 250 on CPU is about every five minutes.
batch_size: 32
grad_accum: 1
max_steps: 1250
weight_decay: 0.1
beta1: 0.9
beta2: 0.95
grad_clip: 1.0
eval_interval: 125
eval_batches: 16
checkpoint_interval: 250
keep_checkpoints: 2
log_interval: 25
seed: 1337
device: auto
dtype: auto

schedule:
  max_lr: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 60
  max_steps: 1250
